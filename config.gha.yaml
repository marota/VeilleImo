# Chaville et Viroflay n'ont plus qu'une URL : la page `recherche?ci=` couvre toute
# la commune. Mesuré le 06/08/2026 (audit id par id) : la seconde URL de Chaville
# renvoyait un jeu STRICTEMENT identique (34 annonces, écart nul), et les 4 pages
# `pl-` de Viroflay n'apportaient qu'une annonce exclusive à elles toutes — pour
# 125 crédits par run. `ci=` est le code INSEE de la commune, préfixe département
# puis numéro sur 4 chiffres (Chaville 92022 -> 920022, Viroflay 78686 -> 780686).
- name: chaville
  commune: chaville
  expect: Chaville
  urls:
  - https://www.bellesdemeures.com/recherche?ci=920022&idpays=250&idtb=2&idtt=2
- name: viroflay
  commune: viroflay
  expect: Viroflay
  urls:
  - https://www.bellesdemeures.com/recherche?ci=780686&idpays=250&idtb=2&idtt=2
# SeLoger : même back-office que Belles Demeures (ids partagés, chaînage natif),
# mais SANS le filtre « luxe » — c'est là qu'apparaît le segment 700 k–1,2 M €.
# Le filtrage est fait côté serveur (priceMin/priceMax/roomCountMin/squareMeterMin)
# pour tenir en une page par commune : peu de volume, peu de crédits.
# `locations` = code AVIV de la commune, numéroté par ordre alphabétique dans le
# département (92 : Chaville 36607 < Meudon 36620 < Sèvres 36629 < Ville-d'Avray 36633).
- name: seloger_sevres
  parser: seloger
  commune: sevres
  expect: Sèvres
  urls:
  - https://www.seloger.com/classified-search?distributionTypes=Buy&estateTypes=House&locations=AD08FR36629&priceMin=700000&priceMax=1200000&roomCountMin=4&squareMeterMin=90
- name: seloger_ville_davray
  parser: seloger
  commune: ville-d'avray
  expect: Ville-d
  urls:
  - https://www.seloger.com/classified-search?distributionTypes=Buy&estateTypes=House&locations=AD08FR36633&priceMin=700000&priceMax=1200000&roomCountMin=4&squareMeterMin=90
- name: seloger_meudon
  parser: seloger
  commune: meudon
  expect: Meudon
  urls:
  - https://www.seloger.com/classified-search?distributionTypes=Buy&estateTypes=House&locations=AD08FR36620&priceMin=700000&priceMax=1200000&roomCountMin=4&squareMeterMin=90
- name: seloger_chaville
  parser: seloger
  commune: chaville
  expect: Chaville
  urls:
  - https://www.seloger.com/classified-search?distributionTypes=Buy&estateTypes=House&locations=AD08FR36607&priceMin=700000&priceMax=1200000&roomCountMin=4&squareMeterMin=90
- name: seloger_viroflay
  parser: seloger
  commune: viroflay
  expect: Viroflay
  urls:
  - https://www.seloger.com/classified-search?distributionTypes=Buy&estateTypes=House&locations=AD08FR32622&priceMin=700000&priceMax=1200000&roomCountMin=4&squareMeterMin=90
